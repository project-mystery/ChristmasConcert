<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>聖なる指示</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: #03030c; /* 聖夜のディープブラック */
            overflow: hidden;
        }

        body { position: relative; }

        /* 星のスタイル（軽量化：drop-shadowをやめてbox-shadowに） */
        .star {
            position: absolute;
            display: block;
            background-color: #fff;
            border-radius: 50%;
            opacity: 0;
            box-shadow: 0 0 6px #fff, 0 0 10px #ffd700;
            animation: twinkle 4s infinite ease-in-out;
            will-change: opacity, transform;
        }

        /* 星がキラキラ光るアニメーション */
        @keyframes twinkle {
            0%   { opacity: 0; transform: scale(0.4); }
            50%  { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0; transform: scale(0.4); }
        }

        /* 画像を表示するエリア：画面いっぱい（3秒待ってから登場） */
        .img-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 0;
            animation: magicRise 3.5s cubic-bezier(0.25, 1, 0.5, 1) 3s forwards;
        }

        .nazotoki-img {
            width: 100%;
            height: 100%;
            /* contain＝画像全体が見える / cover＝余白なしで画面を埋める（端は切れる） */
            object-fit: cover;
            animation: imgFade 3.5s ease-out 3s forwards;
        }

        @keyframes magicRise {
            0%   { opacity: 0; clip-path: inset(100% 0 0 0); }
            100% { opacity: 1; clip-path: inset(0 0 0 0); }
        }

        @keyframes imgFade {
            0%   { filter: blur(8px) brightness(1.4); }
            100% { filter: blur(0) brightness(1); }
        }
    </style>
</head>
<body>

    <!-- 📥 画像を表示する枠エリア -->
    <div class="img-container">
        <img src="ChristmasConcert.PNG" alt="謎解きの指示" class="nazotoki-img">
    </div>

    <script>
        // 🌌 星を自動生成（数を変えたいときはここだけ）
        const STAR_COUNT = 50;
        const frag = document.createDocumentFragment();
        for (let i = 0; i < STAR_COUNT; i++) {
            const s = document.createElement('div');
            const size = 2 + Math.floor(Math.random() * 4); // 2〜5px
            s.className = 'star';
            s.style.top = Math.random() * 100 + '%';
            s.style.left = Math.random() * 100 + '%';
            s.style.width = s.style.height = size + 'px';
            s.style.animationDelay = (Math.random() * 4).toFixed(1) + 's';
            frag.appendChild(s);
        }
        document.body.appendChild(frag);
    </script>
</body>
</html>
